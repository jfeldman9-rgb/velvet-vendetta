<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d13"><meta name="description" content="Choose Cory or Bob in a theatrical, fully voiced arcade fighting game."><title>Velvet Vendetta • Nightshade Arcade</title><link rel="icon" href="assets/crest.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><link rel="preload" href="assets/hero.webp" as="image"></head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3v18l14-9z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-train" viewBox="0 0 24 24"><path d="M8 5 5 8l11 11 3-3zM6 2 2 6m20 12-4 4M16 5l3 3-3.5 3.5M8.5 15.5 5 19m13-17 4 4M2 18l4 4"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M6 9h2m2 0h2m2 0h2m2 0h.1M6 12h2m2 0h2m2 0h2m2 0h.1M8 15h8"/></symbol>
<symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
<symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 10v4m4-8v12m5-15v18m5-15v12m4-8v4"/></symbol>
<symbol id="i-muted" viewBox="0 0 24 24"><path d="M3 10v4m4-8v12m5-15v18m4-11 6 6m0-6-6 6"/></symbol>
<symbol id="i-cross" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-11"/></symbol>
<symbol id="i-stage" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
<symbol id="i-pad" viewBox="0 0 24 24"><path d="M7 7h10c3 0 4 4 5 9 .6 4-2 5-5 2l-2-2H9l-2 2c-3 3-6 2-5-2 1-5 2-9 5-9zM5 11h6m-3-3v6m7-3h.1m3 2h.1"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="4"/></symbol>
</svg>
<header class="topbar">
 <a class="brand" href="#title" id="brand" aria-label="Nightshade Arcade home"><img src="assets/crest.svg" alt=""><span>NIGHTSHADE <b>ARCADE</b></span></a>
 <nav aria-label="Game utilities">
 <button id="moves" class="utility"><svg><use href="#i-list"/></svg><span>Move list</span></button>
 <button id="sound" class="utility" aria-pressed="true"><svg><use href="#i-sound"/></svg><span>Sound on</span></button>
 <button id="full" class="utility icon-only" aria-label="Enter fullscreen" title="Fullscreen"><svg><use href="#i-full"/></svg></button>
 </nav>
</header>
<main id="game">
<section id="home" aria-label="Title screen" class="screen">
 <div class="hero">
  <div class="hero-art"></div><div class="hero-shade"></div>
  <div class="hero-content">
   <div class="eyebrow"><span class="stripe"></span> Original arcade fighter</div>
   <h1 aria-label="Velvet Vendetta"><img class="velvet" src="assets/velvet.svg" alt=""><img class="vendetta" src="assets/vendetta.svg" alt=""></h1>
   <div class="versus"><strong>Cory</strong><em>VS</em><strong>Bob</strong></div>
   <div class="home-actions"><button id="arcade" class="primary action"><svg><use href="#i-play"/></svg>Start arcade</button><button id="practice" class="secondary action"><svg><use href="#i-train"/></svg>Training</button></div>
  </div>
  <div class="hero-index" aria-hidden="true"><span></span><span></span><span></span></div>
 </div>
 <section class="arena-section"><div class="section-heading"><h2><svg><use href="#i-stage"/></svg>Select arena</h2><span>02 STAGES</span></div>
  <div class="arena-grid" role="group" aria-label="Select the arena">
   <button class="arena-card chosen" data-arena="opera" aria-pressed="true"><img src="assets/opera.webp" alt=""><span class="card-tint"></span><span class="stage-copy"><small>Stage 01</small><strong>The Opera House</strong></span><span class="stage-state"></span></button>
   <button class="arena-card" data-arena="glasshouse" aria-pressed="false"><img src="assets/glasshouse.webp" alt=""><span class="card-tint"></span><span class="stage-copy"><small>Stage 02</small><strong>The Glasshouse</strong></span><span class="stage-state"></span></button>
  </div>
 </section>
 <div class="foot"><span><svg><use href="#i-pad"/></svg> Keyboard &amp; touch</span><span class="keys"><kbd>Tab</kbd> Navigate <kbd>Enter</kbd> Select</span></div>
</section>
<section id="select" class="screen subscreen" hidden aria-label="Fighter selection">
 <div class="select-back"></div><div class="select-wrap"><button id="sel-back" class="text-button"><svg><use href="#i-back"/></svg>Title screen</button>
 <div class="eyebrow" id="mode-label">Arcade match</div><h2 class="display">Choose your fighter</h2>
 <div class="fighter-cards" role="group" aria-label="Select a fighter">
 <button data-pick="cory" class="fighter-card" aria-pressed="true"><img src="assets/cory-face.webp" alt="Cory in plum feathers and gilded couture"><span><small>The showstopper</small><b>Cory</b></span><i></i></button>
 <button data-pick="bob" class="fighter-card" aria-pressed="false"><img src="assets/bob-face.webp" alt="Bob in a tailored black suit and dark glasses"><span><small>The operative</small><b>Bob</b></span><i></i></button>
 </div>
 <div class="fighter-info"><div><strong id="style-name"></strong><p id="style-desc"></p></div><button id="begin" class="primary action"><svg><use href="#i-play"/></svg>Fight</button></div>
 </div>
</section>
<section id="battle" class="screen" hidden aria-label="Fight arena">
 <div class="battle-top"><span class="eyebrow" id="venue"></span><button id="pause" class="utility"><svg><use href="#i-pause"/></svg>Pause</button></div>
 <div id="ring"><canvas id="canvas" aria-label="Combat arena with Cory and Bob"></canvas>
 <div class="hud"><div class="fighter-hud" id="hud0"><div class="hud-name"><span></span><strong></strong><i></i></div><div class="health" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="delay"></div><div class="life"></div></div><div class="meter"><div></div></div><small></small></div>
 <div class="clock"><small id="round-tag">Round 1</small><b id="clock">60</b></div>
 <div class="fighter-hud right" id="hud1"><div class="hud-name"><span></span><strong></strong><i></i></div><div class="health" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="delay"></div><div class="life"></div></div><div class="meter"><div></div></div><small></small></div></div>
 <div id="callout" aria-live="polite"><small></small><b></b></div>
 <button id="finish-now" class="primary action" hidden>F · Perform fatality</button>
 <div id="caption" aria-live="polite"></div></div>
 <div class="touchpad"><div class="touch-group dpad"><button data-hold="left" aria-label="Move left"><svg aria-hidden="true" style="transform:none"><use href="#i-back"/></svg></button><button data-hold="right" aria-label="Move right"><svg aria-hidden="true" style="transform:rotate(180deg)"><use href="#i-back"/></svg></button><button data-tap="jump" aria-label="Jump"><svg aria-hidden="true" style="transform:rotate(90deg)"><use href="#i-back"/></svg></button><button data-hold="crouch" aria-label="Crouch"><svg aria-hidden="true" style="transform:rotate(-90deg)"><use href="#i-back"/></svg></button></div><div class="touch-group"><button data-hold="guard">Guard</button><button data-tap="punch">Jab</button><button data-tap="kick">Kick</button><button data-tap="special" class="energy">Special</button></div></div>
 <div class="battle-keys"><span><kbd>A</kbd><kbd>D</kbd> Move</span><span><kbd>W</kbd> Jump</span><span><kbd>S</kbd> Crouch</span><span><kbd>J</kbd> Jab</span><span><kbd>K</kbd> Kick</span><span><kbd>L</kbd> Special</span><span><kbd>Shift</kbd> Guard</span></div>
</section>
</main>
<dialog id="dialog"><div class="dialog-head"><div class="eyebrow" id="dialog-kicker"></div><button class="utility icon-only" id="close" aria-label="Close"><svg><use href="#i-cross"/></svg></button></div><div id="dialog-body"></div></dialog>
<script src="combat.js"></script><script src="render.js"></script><script src="app.js"></script>
</body></html>
